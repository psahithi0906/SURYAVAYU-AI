services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SCADA_API_URL=https://api.kspdcl.com/scada/actuals
      - SCADA_API_KEY=${SCADA_API_KEY:-}
      - EMS_API_URL=https://api.kredl.com/ems/historical
      - EMS_API_KEY=${EMS_API_KEY:-}

  web:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
